<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>D365 F&O Show Table Browser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="mainHelper.js"></script>
    <style>
        .chip { cursor: pointer; margin-right: 5px; margin-bottom: 5px; display: inline-flex; align-items: center; gap: 4px; }
        .chip-close { font-weight: bold; padding: 0 2px; border-radius: 3px; }
        .chip-close:hover { background-color: rgba(0,0,0,0.2); }
    </style>
</head>
<body style="width: 400px;">
<nav class="navbar navbar-expand-lg navbar-light bg-light px-3">
  <a class="navbar-brand" href="#">D365 F&O Table Browser</a>
</nav>

<div class="container mt-3">
    
    <!-- Ortam (Environment) Seçimi -->
    <div class="row mb-2">
        <div class="col-md-12">
            <label for="envSelect" class="form-label mb-1">Environment</label>
            <div class="input-group input-group-sm">
                <select class="form-select" id="envSelect">
                    <option value="">-- Ortam Seçin veya URL Girin --</option>
                </select>
                <!-- Silme Butonu (Başlangıçta Gizli) -->
                <button class="btn btn-outline-danger" type="button" id="btnDeleteEnv" style="display: none;" title="Seçili Ortamı Sil">🗑️</button>
                <button class="btn btn-outline-secondary" type="button" id="btnToggleAddEnv" title="Yeni Ortam Ekle">+</button>
            </div>
        </div>
    </div>

    <!-- Yeni Ortam Ekleme Alanı (Başlangıçta Gizli) -->
    <div class="row mb-2" id="addEnvDiv" style="display: none;">
        <div class="col-md-12">
            <div class="input-group input-group-sm">
                <input type="text" class="form-control" id="newEnvName" placeholder="Örn: Dev">
                <input type="text" class="form-control" id="newEnvUrl" placeholder="https://...">
                <button class="btn btn-success" type="button" id="btnSaveEnv">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Base URL -->
    <div class="row mb-2">
        <div class="col-md-12">
            <label for="baseUrl" class="form-label mb-1">Base Url</label>
            <input type="text" class="form-control form-control-sm" id="baseUrl" placeholder="https://domainName.com/">
        </div>
    </div>

    <!-- Tablo Adı ve Favoriye Ekleme -->
    <div class="row mb-2">
        <div class="col-md-12">
            <label for="tableName" class="form-label mb-1">Table Name</label>
            <div class="input-group input-group-sm">
                <input type="text" class="form-control" id="tableName" placeholder="CustTable">
                <button class="btn btn-outline-warning" type="button" id="btnStar" title="Favorilere Ekle">⭐</button>
            </div>
        </div>
    </div>

    <!-- Favoriler ve Geçmiş Etiketleri -->
    <div class="row mb-2">
        <div class="col-md-12">
            <div id="favoritesContainer"></div>
            <div id="historyContainer" class="mt-1"></div>
        </div>
    </div>

    <!-- Company Code -->
    <div class="row mb-3">
        <div class="col-md-12">
            <label for="companyCode" class="form-label mb-1">Company Code</label>
            <input type="text" class="form-control form-control-sm" id="companyCode" placeholder="USMF">
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <button id="btnShow" class="btn btn-primary w-100">Show / Go</button>
        </div>
    </div>
</div>

<hr>

<div class="container mb-2 text-center">
    <button id="btnGithub" class="btn btn-sm btn-dark me-2">Github</button>
    <button id="btnBuymeacoffee" class="btn btn-sm btn-light p-0" style="border:none;">
        <img id="imgBuymeacoffee" src="img/buymeacoffee-blue-button.png" height="30" alt="Buy me a coffee"/>
    </button>
</div>

</body>
</html>
